name: perthesmetrics
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pytorch=2.5.1
  - torchvision
  - pytorch-cuda=12.4
  - pip:
      - nnunetv2==2.5.1
      - nibabel>=5.0,<6
      - SimpleITK>=2.2,<3
      - PyYAML>=6.0,<7
      - matplotlib>=3.7,<4
      - Pillow>=10,<13
      - CairoSVG>=2.7,<3
